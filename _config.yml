title: "InnovationLet Finance"
short_title: "Finance"
tagline: "Markets, fintech and digital assets, decoded."
description: >-
  InnovationLet Finance covers markets, fintech, enterprise finance and
  digital assets for people who move money. Independent reporting and
  analysis from the InnovationLet editorial desk.
author: "InnovationLet Editorial"
email: "hello@innovationlet.com"

lang: "en"
locale: "en_US"

url: "https://innovationlet.github.io"
baseurl: "/finance"
main_site: "https://innovationlet.github.io"

category_name: "Finance"
category_meta: "Markets · Fintech · Digital assets"
accent: "green"
hero_title: "Where capital meets code."
hero_lead: >-
  Markets, fintech and digital assets, reported for the people who
  build, fund and account for the money movement.

logo: "/favicon.svg"

twitter_username: "innovationlet"
github_username: "innovationlet"
linkedin_username: "innovationlet"

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: "feed.xml"

show_excerpts: true

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"

defaults:
  - scope:
      path: ""
    values:
      image:
        path: "/assets/images/og-image.png"
        width: 1200
        height: 630
        alt: "InnovationLet — technology and innovation, decoded"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "InnovationLet Editorial"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

exclude:
  - "Gemfile"
  - "Gemfile.lock"
  - "vendor"
